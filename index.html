<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The page never zooms: on a phone a pinch belongs to the 3D viewport,
         and a page zoomed by one left the instrument stuck in a corner of
         the window. maximum-scale also keeps iOS from zooming in on a
         focused field and staying there. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Rotatrix for ScanRuler</title>
    <meta
      name="description"
      content="An unofficial ScanRuler build prepared by Rotatrix to demonstrate OpenAxis navigation."
    />
    <!-- The tab icon is the logo's mark, simplified for 16 px; the .ico is
         for browsers that take no SVG. The full logo set is in docs/brand. -->
    
    
    <link rel="preload" href="/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/b612-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* pre-CSS paint: chassis gray instead of a white flash — and the dark
         chassis where that is what was chosen (the same key the settings
         store keeps it under; the figures match --chassis in styles.css). */
      html { background: #e7e6e1; }
      html[data-theme='dark'] { background: #1b1d20; }
    </style>
    <script>
      try {
        var t = localStorage.getItem('scanruler.uitheme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  <link rel="icon" href="data:,"></head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <dialog id="rotatrix-preview" aria-labelledby="preview-title" aria-describedby="preview-message">
  <h2 id="preview-title">Rotatrix for ScanRuler</h2>
  <p id="preview-message">I put this unofficial build of ScanRuler together so you can try navigating a scan with your Rotatrix controller. Start Rotatrix, then open a scan to try it.</p>
  <p>— David from Rotatrix</p>
  <form method="dialog"><button autofocus>Open preview</button></form>
</dialog>
<style>
  #rotatrix-preview { box-sizing: border-box; width: min(27rem, calc(100vw - 2rem)); padding: 1.5rem; border: 1px solid #777; border-radius: .6rem; color: CanvasText; background: Canvas; font: 1rem/1.5 Barlow, sans-serif; }
  #rotatrix-preview::backdrop { background: rgb(0 0 0 / 55%); }
  #rotatrix-preview h2 { margin: 0; }
  #rotatrix-preview button { font: inherit; padding: .35rem .85rem; cursor: pointer; }
</style>
<script>
  (() => {
    const dialog = document.getElementById('rotatrix-preview')
    const key = 'rotatrix.scanruler.preview.welcome.v1'
    try { if (localStorage.getItem(key)) return } catch {}
    const remember = () => {
      try { localStorage.setItem(key, 'seen') } catch {}
    }
    dialog.addEventListener('submit', remember, { once: true })
    dialog.addEventListener('cancel', remember, { once: true })
    dialog.showModal()
  })()
</script>

</body>
</html>
